<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>关于me</title>
    <style>
        /* 全局重置 & 字体 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f8fafc;
            color: #0f172a;
            line-height: 1.7;
            padding: 2rem 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            max-width: 820px;
            width: 100%;
            background: #ffffff;
            border-radius: 32px;
            padding: 3rem 2.5rem;
            box-shadow: 0 20px 60px -12px rgba(0, 0, 0, 0.08);
            border: 1px solid #e9edf4;
            transition: all 0.2s;
        }
        /* 头部徽标 */
        .badge {
            display: inline-block;
            background: #eef2ff;
            color: #4f46e5;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.2rem 1rem;
            border-radius: 100px;
            letter-spacing: 0.3px;
            margin-bottom: 1.5rem;
        }
        h1 {
            font-size: 2.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.2;
            margin-bottom: 1rem;
        }
        h1 span {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subhead {
            font-size: 1.15rem;
            color: #334155;
            margin-bottom: 2.5rem;
            border-left: 4px solid #4f46e5;
            padding-left: 1.2rem;
            font-weight: 400;
        }
        h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-top: 2rem;
            margin-bottom: 0.75rem;
            color: #0f172a;
        }
        p {
            color: #1e293b;
            margin-bottom: 1rem;
        }
        ul {
            list-style: none;
            padding: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.6rem 1.2rem;
            margin: 1.2rem 0 1.8rem;
        }
        ul li {
            position: relative;
            padding-left: 1.6rem;
        }
        ul li::before {
            content: "✦";
            position: absolute;
            left: 0;
            color: #4f46e5;
            font-weight: 700;
        }
        .footer-note {
            margin-top: 2.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e9edf4;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            font-size: 0.95rem;
            color: #475569;
        }
        .btn {
            display: inline-block;
            background: #0f172a;
            color: #fff;
            padding: 0.5rem 1.8rem;
            border-radius: 100px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #1e293b;
        }
        /* 响应式 */
        @media (max-width: 600px) {
            .card {
                padding: 2rem 1.2rem;
            }
            h1 {
                font-size: 2rem;
            }
            ul {
                grid-template-columns: 1fr;
            }
            .footer-note {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- 小标签 -->
        <div class="badge">✦ 我的介绍</div>

        <!-- 主标题 -->
        <h1>
            你好我是 <span>RE_CAT</span>
        </h1>
        <div class="subhead">
            你也可以叫我卓睿之猫🐱
        </div>

        <h2>✦ 我的联系方式</h2>
        <ul>
            <li>3563947920@qq.com</li>
            <li>arch.recat@gmail.com</li>
            <li>Weixin@Crystal_Level_Code</li>
            <li>TG@RE_CAT0</li>
            <li>github/RE-Cat</li>
        </ul>

        <h2>✦ 正式内容</h2>
        <p>
           还没有想到什么东西呢<br />
        </p>

        <!-- 底部 -->
        <div class="footer-note">
            <span>© 2026 recat · 持续迭代中</span>
            <a href="https://b23.tv/VWEkjgd" class="btn">My bilibili</a>
        </div>
    </div>
</body>
</html>
