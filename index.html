<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>RE_CAT · 个人主页</title>

  <!-- MD3 标准字体：Roboto + Material Symbols（内联 SVG 替代，不依赖外网字体） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

  <style>
    /* ============ MD3 设计令牌 (Design Tokens) ============ */
    :root {
      --md-primary: #6750A4;
      --md-on-primary: #FFFFFF;
      --md-primary-container: #EADDFF;
      --md-on-primary-container: #21005D;
      --md-surface: #FFFFFF;
      --md-surface-dim: #F7F5F2;
      --md-surface-container-lowest: #FFFFFF;
      --md-surface-container-low: #FAF9F7;
      --md-surface-container: #F3F1ED;
      --md-surface-container-high: #ECE9E4;
      --md-surface-container-highest: #E6E2DC;
      --md-on-surface: #1D1B20;
      --md-on-surface-variant: #49454F;
      --md-outline: #79747E;
      --md-outline-variant: #CAC4D0;

      --md-corner-full: 9999px;
      --md-corner-l: 20px;
      --md-corner-m: 16px;
      --md-corner-s: 12px;

      --md-elevation-1: 0 1px 2px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.04);
      --md-elevation-2: 0 2px 6px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.04);
      --md-elevation-3: 0 4px 12px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);

      --md-motion-standard: cubic-bezier(0.2, 0, 0, 1);
      --md-motion-emphasized: cubic-bezier(0.05, 0.7, 0.1, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--md-surface-dim);
      color: var(--md-on-surface);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ============ App 容器 ============ */
    .app {
      width: 100%;
      max-width: 480px;
      background: var(--md-surface);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 40px rgba(0,0,0,0.03);
      overflow-x: hidden;
    }

    /* ============ 顶部进度条 (MD3 LinearProgressIndicator 风格) ============ */
    .scroll-progress {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      height: 4px;
      z-index: 100;
      pointer-events: none;
      background: transparent;
    }

    .scroll-progress .track {
      width: 100%;
      height: 4px;
      background: var(--md-surface-container-highest);
      border-radius: 0;
      overflow: hidden;
      position: relative;
    }

    /* 进度轨道间隙 (MD3 2024 规范) */
    .scroll-progress .track::after {
      content: '';
      position: absolute;
      right: 0;
      top: 0;
      width: 12px;
      height: 100%;
      background: var(--md-surface);
      z-index: 2;
    }

    .scroll-progress .indicator {
      height: 100%;
      width: 0%;
      background: var(--md-primary);
      border-radius: var(--md-corner-full);
      transition: width 0.15s var(--md-motion-standard);
      position: relative;
      z-index: 1;
    }

    /* 停止指示器 (MD3 2024 规范) */
    .scroll-progress .indicator::after {
      content: '';
      position: absolute;
      right: -2px;
      top: 50%;
      transform: translateY(-50%);
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--md-primary);
    }

    /* ============ 页面 ============ */
    .page {
      flex: 1;
      display: none;
      flex-direction: column;
      padding: 28px 20px 140px; /* 底部留白给悬浮导航栏 */
      animation: mdFadeIn 0.35s var(--md-motion-emphasized);
    }

    .page.active {
      display: flex;
    }

    @keyframes mdFadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ============ 第一页：个人信息 ============ */
    .profile-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding-top: 8px;
    }

    .avatar {
      width: 128px;
      height: 128px;
      border-radius: var(--md-corner-full);
      background: var(--md-surface);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      overflow: hidden;
      box-shadow: var(--md-elevation-3);
      border: 4px solid var(--md-surface);
      outline: 1px solid var(--md-outline-variant);
      flex-shrink: 0;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .avatar-placeholder {
      font-size: 3.4rem;
      font-weight: 500;
      color: var(--md-on-surface-variant);
      line-height: 1;
    }

    .username {
      font-size: 2.05rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: var(--md-on-surface);
      margin-bottom: 6px;
      line-height: 1.15;
    }

    .tagline {
      font-size: 0.92rem;
      font-weight: 400;
      color: var(--md-on-surface-variant);
      margin-bottom: 32px;
      line-height: 1.4;
    }

    /* ============ 社交卡片 (MD3 List + Ripple) ============ */
    .social-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .social-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      background: var(--md-surface-container-low);
      border-radius: var(--md-corner-m);
      text-decoration: none;
      color: inherit;
      transition: background 0.2s var(--md-motion-standard), transform 0.15s var(--md-motion-standard);
      border: none;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
      position: relative;
      overflow: hidden;
    }

    .social-item:hover {
      background: var(--md-surface-container);
    }

    .social-item:active {
      transform: scale(0.98);
    }

    /* Ripple 水波纹 */
    .social-item .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(103, 80, 164, 0.12);
      transform: scale(0);
      animation: rippleAnim 0.6s var(--md-motion-standard);
      pointer-events: none;
    }

    @keyframes rippleAnim {
      to { transform: scale(4); opacity: 0; }
    }

    .social-item.static {
      cursor: default;
    }

    .social-item.static:active {
      transform: none;
    }

    .social-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .social-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--md-corner-full);
      background: var(--md-primary-container);
      color: var(--md-on-primary-container);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      font-weight: 600;
      flex-shrink: 0;
    }

    .social-label {
      font-size: 1rem;
      font-weight: 500;
      color: var(--md-on-surface);
    }

    .social-handle {
      font-size: 0.88rem;
      font-weight: 400;
      color: var(--md-on-surface-variant);
      text-align: right;
      flex-shrink: 1;
      min-width: 0;
      line-height: 1.35;
      word-break: break-all;
    }

    /* ============ 第二页：游戏页 ============ */
    .game-page {
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 28px 160px;
      gap: 0;
    }

    .game-icon-wrapper {
      width: 96px;
      height: 96px;
      border-radius: var(--md-corner-full);
      background: var(--md-primary-container);
      color: var(--md-on-primary-container);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
    }

    .game-icon-wrapper svg {
      width: 48px;
      height: 48px;
    }

    .game-title {
      font-size: 1.75rem;
      font-weight: 500;
      color: var(--md-on-surface);
      margin-bottom: 12px;
    }

    .game-desc {
      font-size: 0.95rem;
      color: var(--md-on-surface-variant);
      line-height: 1.55;
      max-width: 280px;
      margin-bottom: 36px;
    }

    /* MD3 Filled Button */
    .game-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--md-primary);
      color: var(--md-on-primary);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      letter-spacing: 0.3px;
      padding: 16px 28px;
      border-radius: var(--md-corner-full);
      border: none;
      transition: background 0.2s var(--md-motion-standard), transform 0.15s var(--md-motion-standard), box-shadow 0.2s var(--md-motion-standard);
      box-shadow: var(--md-elevation-1);
      cursor: pointer;
      min-height: 56px;
      position: relative;
      overflow: hidden;
    }

    .game-button:hover {
      background: #7965AF;
      box-shadow: var(--md-elevation-2);
    }

    .game-button:active {
      transform: scale(0.97);
      box-shadow: none;
    }

    .game-button svg {
      width: 20px;
      height: 20px;
    }

    .game-url {
      margin-top: 20px;
      font-size: 0.75rem;
      color: var(--md-outline);
    }

    /* ============ MD3 悬浮导航栏 (Floating Navigation Bar) ============ */
    .floating-nav {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 40px);
      max-width: 400px;
      z-index: 50;
      pointer-events: none;
    }

    .floating-nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-around;
      background: var(--md-surface-container-high);
      border-radius: var(--md-corner-full);
      padding: 8px 12px;
      box-shadow: var(--md-elevation-3);
      pointer-events: auto;
      border: 1px solid var(--md-outline-variant);
      backdrop-filter: blur(12px);
      background: rgba(243, 241, 237, 0.92);
    }

    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      background: transparent;
      border: none;
      font-family: inherit;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.2px;
      color: var(--md-on-surface-variant);
      padding: 6px 0;
      cursor: pointer;
      transition: color 0.2s var(--md-motion-standard);
      position: relative;
      -webkit-tap-highlight-color: transparent;
      border-radius: var(--md-corner-l);
      overflow: hidden;
    }

    .nav-btn .icon-pill {
      width: 56px;
      height: 32px;
      border-radius: var(--md-corner-full);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.25s var(--md-motion-emphasized), transform 0.2s var(--md-motion-emphasized);
      position: relative;
    }

    .nav-btn svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke-width 0.2s var(--md-motion-standard);
    }

    /* 选中状态：MD3 active indicator 药丸 */
    .nav-btn.active {
      color: var(--md-on-surface);
      font-weight: 600;
    }

    .nav-btn.active .icon-pill {
      background: var(--md-primary-container);
    }

    .nav-btn.active svg {
      stroke: var(--md-on-primary-container);
      stroke-width: 2.2;
    }

    .nav-btn:active .icon-pill {
      transform: scale(0.92);
    }

    /* 导航按钮 Ripple */
    .nav-btn .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(103, 80, 164, 0.15);
      transform: scale(0);
      animation: rippleAnim 0.5s var(--md-motion-standard);
      pointer-events: none;
    }

    /* ============ 响应式 ============ */
    @media (max-width: 380px) {
      .page {
        padding: 22px 16px 140px;
      }
      .avatar {
        width: 108px;
        height: 108px;
      }
      .username {
        font-size: 1.8rem;
      }
      .social-item {
        padding: 12px 14px;
      }
      .social-icon {
        width: 36px;
        height: 36px;
        font-size: 0.85rem;
      }
      .social-label {
        font-size: 0.92rem;
      }
      .social-handle {
        font-size: 0.82rem;
      }
      .floating-nav {
        bottom: 16px;
        width: calc(100% - 32px);
      }
      .floating-nav-inner {
        padding: 6px 8px;
      }
    }
  </style>
</head>
<body>

  <div class="app">
    <!-- ============ 顶部滚动进度条 ============ -->
    <div class="scroll-progress" id="scrollProgress">
      <div class="track">
        <div class="indicator" id="progressIndicator"></div>
      </div>
    </div>

    <!-- ============ 第一页：个人信息 ============ -->
    <div class="page active" id="page-profile">
      <div class="profile-section">
        <div class="avatar">
          <img src="re_cat.webp" alt="RE_CAT avatar">
        </div>

        <h1 class="username">RE_CAT</h1>
        <p class="tagline">digital creature · 偶尔写游戏</p>

        <div class="social-list">

          <!-- Bilibili -->
          <a href="https://space.bilibili.com/" class="social-item" target="_blank" rel="noopener noreferrer">
            <div class="social-left">
              <span class="social-icon">B</span>
              <span class="social-label">Bilibili</span>
            </div>
            <span class="social-handle">@ARE_CAT</span>
          </a>

          <!-- Weixin -->
          <div class="social-item static">
            <div class="social-left">
              <span class="social-icon">微</span>
              <span class="social-label">Weixin</span>
            </div>
            <span class="social-handle">@Re_Cat_Me</span>
          </div>

          <!-- Gmail -->
          <a href="mailto:arch.recat@gmail.com" class="social-item">
            <div class="social-left">
              <span class="social-icon">G</span>
              <span class="social-label">Gmail</span>
            </div>
            <span class="social-handle">arch.recat@gmail.com</span>
          </a>

          <!-- Telegram -->
          <a href="https://t.me/RE_CAT0" class="social-item" target="_blank" rel="noopener noreferrer">
            <div class="social-left">
              <span class="social-icon">TG</span>
              <span class="social-label">Telegram</span>
            </div>
            <span class="social-handle">@RE_CAT0</span>
          </a>

        </div>
      </div>
    </div>

    <!-- ============ 第二页：游戏页 ============ -->
    <div class="page game-page" id="page-game">
      <div class="game-icon-wrapper">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M21.58 16.09l-1.09-7.66A3.99 3.99 0 0 0 16.53 5H7.47a3.99 3.99 0 0 0-3.96 3.43l-1.09 7.66A3.5 3.5 0 0 0 5.9 20c.95 0 1.85-.38 2.52-1.06L10.5 17h3l2.08 1.94c.67.68 1.57 1.06 2.52 1.06a3.5 3.5 0 0 0 3.48-3.91zM9 13H7v-2h2v2zm0-3H7V8h2v2zm5 3h-2v-2h2v2zm0-3h-2V8h2v2zm3 3h-2v-2h2v2zm0-3h-2V8h2v2z"/>
        </svg>
      </div>

      <h2 class="game-title">古诗 小游戏</h2>
      <p class="game-desc">我自己制作的学习小游戏<br>点击下方按钮直接开玩</p>

      <a href="game.html" class="game-button" >
        <span>进入游戏</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </a>

      <div class="game-url">xfast.cc.cd/game.html</div>
    </div>

    <!-- ============ MD3 悬浮导航栏 ============ -->
    <div class="floating-nav">
      <div class="floating-nav-inner">
        <button class="nav-btn active" id="navProfile" aria-label="个人信息">
          <span class="icon-pill">
            <svg viewBox="0 0 24 24">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </span>
          <span>我的</span>
        </button>

        <button class="nav-btn" id="navGame" aria-label="游戏">
          <span class="icon-pill">
            <svg viewBox="0 0 24 24">
              <rect x="2" y="6" width="20" height="12" rx="3" ry="3"></rect>
              <line x1="8" y1="12" x2="16" y2="12"></line>
              <line x1="12" y1="8" x2="12" y2="16"></line>
            </svg>
          </span>
          <span>游戏</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const pageProfile = document.getElementById('page-profile');
      const pageGame = document.getElementById('page-game');
      const navProfile = document.getElementById('navProfile');
      const navGame = document.getElementById('navGame');
      const progressIndicator = document.getElementById('progressIndicator');

      // ============ 页面切换 ============
      function setActivePage(pageId) {
        pageProfile.classList.remove('active');
        pageGame.classList.remove('active');
        navProfile.classList.remove('active');
        navGame.classList.remove('active');

        if (pageId === 'profile') {
          pageProfile.classList.add('active');
          navProfile.classList.add('active');
        } else {
          pageGame.classList.add('active');
          navGame.classList.add('active');
        }
      }

      navProfile.addEventListener('click', (e) => {
        setActivePage('profile');
        createRipple(e.currentTarget, e);
      });

      navGame.addEventListener('click', (e) => {
        setActivePage('game');
        createRipple(e.currentTarget, e);
      });

      // ============ Ripple 水波纹 ============
      function createRipple(container, event) {
        const ripple = document.createElement('span');
        ripple.classList.add('ripple');
        const rect = container.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        const x = event.clientX - rect.left - size / 2;
        const y = event.clientY - rect.top - size / 2;
        ripple.style.width = ripple.style.height = size + 'px';
        ripple.style.left = x + 'px';
        ripple.style.top = y + 'px';
        container.appendChild(ripple);
        ripple.addEventListener('animationend', () => ripple.remove());
      }

      // ============ 滚动进度条 (MD3 LinearProgressIndicator) ============
      function updateProgress() {
        const doc = document.documentElement;
        const scrollTop = window.scrollY || doc.scrollTop || document.body.scrollTop || 0;
        const scrollHeight = doc.scrollHeight - doc.clientHeight;
        const progress = scrollHeight > 0 ? (scrollTop / scrollHeight) * 100 : 0;
        progressIndicator.style.width = Math.min(progress, 100) + '%';
      }

      window.addEventListener('scroll', updateProgress, { passive: true });
      window.addEventListener('resize', updateProgress);
      updateProgress();

      // ============ 社交卡片 Ripple ============
      document.querySelectorAll('.social-item:not(.static)').forEach(item => {
        item.addEventListener('click', (e) => {
          createRipple(item, e);
        });
      });
    })();
  </script>
</body>
