<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RE_CAT · 个人主页</title>
  <!-- 柔和的字体与基础样式 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f7f5f2;  /* 暖白基底 */
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      color: #1e1e1e;
    }

    /* 主内容区域 – 包裹页面卡片，保持底部导航固定 */
    .app {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      background: #ffffff;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.02);
      min-height: 100vh;  /* 让白色背景贯穿 */
      position: relative;
      border-radius: 0;    /* 移动端全宽，如果需要可加圆角 */
    }

    /* 页面内容容器 (会随页面切换显示/隐藏) */
    .page {
      flex: 1;
      display: none;
      flex-direction: column;
      padding: 32px 24px 20px;
      animation: fadeIn 0.25s ease;
    }

    .page.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ---------- 第一页：个人信息 ---------- */
    .profile-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #e0dbd2;  /* 占位底色 */
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 10px 20px -8px rgba(0, 0, 0, 0.1);
      border: 3px solid #ffffff;
      outline: 1px solid #eeeae4;
      overflow: hidden;
      transition: transform 0.2s ease;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 如果没有图片，用文字/图标替代——这里使用 CSS 绘制一个可爱的猫爪/字母，但为了通用性，保留背景色+首字母 */
    .avatar-placeholder {
      font-size: 3.2rem;
      font-weight: 600;
      color: #b1a79b;
      letter-spacing: 1px;
      text-transform: uppercase;
      line-height: 1;
    }

    .username {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
      color: #111;
    }

    .username small {
      font-size: 1rem;
      font-weight: 400;
      color: #9c8f82;
      margin-left: 6px;
      letter-spacing: 0.3px;
    }

    .tagline {
      font-size: 0.9rem;
      color: #8f8479;
      margin-bottom: 28px;
      font-weight: 400;
    }

    /* 社交卡片列表 */
    .social-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 8px;
    }

    .social-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: #faf9f7;
      border-radius: 18px;
      border: 1px solid #f0ece7;
      transition: all 0.15s ease;
      text-decoration: none;
      color: inherit;
    }

    .social-item:hover {
      background: #f3f1ed;
      border-color: #e4ddd4;
      transform: scale(1.005);
    }

    .social-left {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 500;
    }

    .social-icon {
      width: 28px;
      height: 28px;
      background: #e9e3db;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #6b5f54;
      font-weight: 600;
      flex-shrink: 0;
    }

    .social-label {
      font-size: 0.98rem;
      color: #3d352e;
    }

    .social-handle {
      font-size: 0.92rem;
      color: #7b6e62;
      font-weight: 400;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* 第二个页面专属样式 */
    .game-page {
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 24px;
    }

    .game-icon {
      font-size: 4rem;
      margin-bottom: 24px;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.05));
    }

    .game-title {
      font-size: 1.8rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
    }

    .game-desc {
      font-size: 1rem;
      color: #7b6e62;
      max-width: 260px;
      margin-bottom: 32px;
      line-height: 1.5;
    }

    .game-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #1e1e1e;
      color: white;
      text-decoration: none;
      font-weight: 500;
      padding: 16px 32px;
      border-radius: 60px;
      font-size: 1.05rem;
      letter-spacing: 0.3px;
      transition: all 0.2s ease;
      border: 1px solid #1e1e1e;
      box-shadow: 0 8px 16px -6px rgba(0, 0, 0, 0.15);
    }

    .game-button:hover {
      background: #333;
      border-color: #333;
      transform: translateY(-2px);
      box-shadow: 0 14px 22px -10px rgba(0, 0, 0, 0.2);
    }

    .game-button:active {
      transform: translateY(0);
      box-shadow: 0 6px 12px -8px rgba(0, 0, 0, 0.2);
    }

    /* 底部导航栏 */
    .bottom-nav {
      display: flex;
      align-items: center;
      justify-content: space-around;
      background: #ffffff;
      border-top: 1px solid #f0ece7;
      padding: 10px 0 12px;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      position: sticky;
      bottom: 0;
      z-index: 10;
      backdrop-filter: blur(8px);
      background: rgba(255, 255, 255, 0.95);
    }

    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: transparent;
      border: none;
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 500;
      color: #a89e93;
      padding: 8px 0 4px;
      cursor: pointer;
      transition: color 0.15s ease, transform 0.1s ease;
      letter-spacing: 0.2px;
      -webkit-tap-highlight-color: transparent;
    }

    .nav-btn svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s ease;
    }

    .nav-btn.active {
      color: #1e1e1e;
      font-weight: 600;
    }

    .nav-btn.active svg {
      stroke: #1e1e1e;
      stroke-width: 2;
    }

    .nav-btn:hover {
      color: #5a4f46;
    }

    .nav-btn:active {
      transform: scale(0.96);
    }

    /* 小调整 */
    .spacer {
      height: 4px;
    }

    /* 移动端友好的内边距 */
    @media (max-width: 420px) {
      .page {
        padding: 24px 18px 16px;
      }
      .avatar {
        width: 100px;
        height: 100px;
      }
      .username {
        font-size: 1.7rem;
      }
      .social-item {
        padding: 12px 14px;
      }
      .social-handle {
        max-width: 130px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- 第一页：个人信息 -->
    <div class="page active" id="page-profile">
      <div class="profile-section">
        <!-- 头像区: 因为无实际图片，用占位文字 RE 表示猫猫感，也可以替换成img -->
        <div class="avatar">
          <!-- 此处可换成 <img src="你的头像url" alt="RE_CAT avatar">，目前用文字占位 -->
          <span class="avatar-placeholder">🐱</span>
        </div>
        <div class="username">RE_CAT</div>
        <div class="tagline">digital creature · 偶尔写游戏</div>

        <!-- 社交链接列表，使用语义化锚点 -->
        <div class="social-list">
          <!-- Bilibili -->
          <a href="https://space.bilibili.com/" class="social-item" target="_blank" rel="noopener noreferrer">
            <div class="social-left">
              <span class="social-icon">B</span>
              <span class="social-label">Bilibili</span>
            </div>
            <span class="social-handle">@ARE_CAT</span>
          </a>

          <!-- Weixin (微信) 用文本展示，可添加复制或跳转? 一般展示微信号-->
          <div class="social-item" style="cursor: default;">
            <div class="social-left">
              <span class="social-icon">微</span>
              <span class="social-label">Weixin</span>
            </div>
            <span class="social-handle">@Re_Cat_Me</span>
          </div>

          <!-- Gmail -->
          <a href="mailto:arch.recat@gmail.com" class="social-item">
            <div class="social-left">
              <span class="social-icon">G</span>
              <span class="social-label">Gmail</span>
            </div>
            <span class="social-handle">arch.recat@gmail.com</span>
          </a>

          <!-- Telegram -->
          <a href="https://t.me/RE_CAT0" class="social-item" target="_blank" rel="noopener noreferrer">
            <div class="social-left">
              <span class="social-icon">TG</span>
              <span class="social-label">Telegram</span>
            </div>
            <span class="social-handle">@RE_CAT0</span>
          </a>
        </div>
      </div>
      <div class="spacer"></div>
    </div>

    <!-- 第二页：游戏页面 (内容展示+跳转链接) -->
    <div class="page game-page" id="page-game">
      <div class="game-icon">🎮</div>
      <div class="game-title">XF Game</div>
      <div class="game-desc">
        我自己制作的小游戏<br>点击下方按钮直接开玩
      </div>
      <!-- 跳转至 xfast.cc.cd/game.html -->
      <a href="http://xfast.cc.cd/game.html" class="game-button" target="_blank" rel="noopener noreferrer">
        <span>进入游戏</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="stroke: white;">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </a>
      <div style="margin-top: 24px; font-size: 0.8rem; color: #b9afa5;">
        xfast.cc.cd/game.html
      </div>
    </div>

    <!-- 底部导航栏 -->
    <nav class="bottom-nav">
      <button class="nav-btn active" id="navProfile" aria-label="个人信息">
        <svg viewBox="0 0 24 24">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span>我的</span>
      </button>
      <button class="nav-btn" id="navGame" aria-label="游戏">
        <svg viewBox="0 0 24 24">
          <rect x="2" y="6" width="20" height="12" rx="3" ry="3"></rect>
          <line x1="8" y1="12" x2="16" y2="12"></line>
          <line x1="12" y1="8" x2="12" y2="16"></line>
        </svg>
        <span>游戏</span>
      </button>
    </nav>
  </div>

  <script>
    (function() {
      // 获取页面元素
      const pageProfile = document.getElementById('page-profile');
      const pageGame = document.getElementById('page-game');
      const navProfile = document.getElementById('navProfile');
      const navGame = document.getElementById('navGame');

      // 切换页面函数
      function setActivePage(pageId) {
        // 隐藏所有页面
        pageProfile.classList.remove('active');
        pageGame.classList.remove('active');

        // 显示选中页面
        if (pageId === 'profile') {
          pageProfile.classList.add('active');
          navProfile.classList.add('active');
          navGame.classList.remove('active');
        } else if (pageId === 'game') {
          pageGame.classList.add('active');
          navGame.classList.add('active');
          navProfile.classList.remove('active');
        }
      }

      // 为导航按钮绑定事件
      navProfile.addEventListener('click', function() {
        setActivePage('profile');
      });

      navGame.addEventListener('click', function() {
        setActivePage('game');
      });

      // 可选：检查url hash? 但为了简单，不处理。保持默认第一页。
      // 如果希望点击游戏按钮后，在游戏页面有一个跳转，但已经用a标签实现了。
      // 确保所有社交链接无干扰。
    })();
  </script>

  <!-- 一些额外的安全处理：如果目标网站是http，但当前是https可能被block，保留用户自行处理 -->
  <!-- 注意：xfast.cc.cd/game.html 可能无https，但用户要求原样跳转，直接使用a标签即可 -->
</body>
</html>
