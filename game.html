<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>初中古诗默写大挑战</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:linear-gradient(160deg,#0d1b2a 0%,#1b2d45 40%,#2c1e3a 100%);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'华文楷体','KaiTi','Microsoft YaHei',serif;
  padding:12px;
  overflow-x:hidden;
  position:relative;
}
/* 星空 */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background-image:
    radial-gradient(2px 2px at 15% 25%, #fff, transparent),
    radial-gradient(1px 1px at 55% 65%, #ffd, transparent),
    radial-gradient(2px 2px at 85% 15%, #aaf, transparent),
    radial-gradient(1px 1px at 35% 85%, #fff, transparent),
    radial-gradient(1px 1px at 75% 45%, #ffd, transparent),
    radial-gradient(2px 2px at 5% 55%, #fff, transparent);
  background-size:250px 250px,300px 300px,280px 280px,320px 320px,260px 260px,350px 350px;
  animation:starMove 80s linear infinite;
  opacity:0.5;
  z-index:0;
}
@keyframes starMove{from{background-position:0 0;}to{background-position:250px 750px;}}

/* 飘落墨点 */
.ink-dot{
  position:fixed;
  border-radius:50%;
  background:radial-gradient(circle,#f5e6c8,transparent);
  pointer-events:none;
  z-index:1;
  animation:inkFall linear infinite;
  opacity:0.3;
}
@keyframes inkFall{
  0%{transform:translateY(-10vh) scale(0.5);opacity:0.4;}
  100%{transform:translateY(110vh) scale(1.2);opacity:0;}
}

/* 主容器 */
.game-wrap{
  position:relative;
  z-index:5;
  max-width:900px;
  width:100%;
  background:linear-gradient(170deg,#fdf6e3,#f5e6c8 70%,#ead9b5);
  border-radius:32px;
  box-shadow:0 25px 70px rgba(0,0,0,0.85),0 0 100px rgba(180,140,80,0.15),inset 0 0 0 3px #c9a96a;
  padding:0 0 22px;
  border:2px solid #b8955a;
  overflow:hidden;
}

/* 顶部栏 */
.top-bar{
  background:linear-gradient(90deg,#1a1208,#3d2b14,#1a1208);
  padding:14px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  border-bottom:3px solid #c9a96a;
  position:relative;
}
.top-bar::after{
  content:'';
  position:absolute;
  bottom:-3px;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent,#ffd700,transparent);
}
.mode-badge{
  display:flex;align-items:center;gap:10px;color:#f5e6c8;
}
.mode-icon{
  width:42px;height:42px;
  background:radial-gradient(circle,#ffd700,#b8860b);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:1.4rem;
  border:2px solid #ffd700;
  box-shadow:0 0 15px rgba(255,215,0,0.5);
  animation:iconPulse 2s ease-in-out infinite;
}
@keyframes iconPulse{
  0%,100%{box-shadow:0 0 15px rgba(255,215,0,0.5);}
  50%{box-shadow:0 0 28px rgba(255,215,0,0.9);}
}
.mode-name{font-size:1.05rem;font-weight:700;letter-spacing:2px;color:#ffd700;text-shadow:0 0 10px rgba(255,215,0,0.4);}
.mode-sub{font-size:0.7rem;color:#c9a96a;letter-spacing:1px;}

.timer-box{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,0.08);
  padding:6px 18px;border-radius:40px;
  border:1px solid #c9a96a;
  color:#f5e6c8;font-size:1rem;font-weight:700;
}
.timer-value{
  font-size:1.5rem;color:#ffd700;
  text-shadow:0 0 10px rgba(255,215,0,0.6);
  min-width:60px;text-align:center;
  font-family:'Courier New',monospace;
}
.timer-value.warning{color:#ff5252;text-shadow:0 0 15px rgba(255,80,80,0.9);animation:timerBlink 0.5s ease infinite;}
@keyframes timerBlink{0%,100%{opacity:1;}50%{opacity:0.4;}}

.score-box{
  display:flex;align-items:center;gap:8px;
  color:#f5e6c8;font-size:0.95rem;
}
.score-num{
  background:#3e2e1c;color:#ffd700;
  padding:4px 16px;border-radius:30px;
  font-size:1.3rem;font-weight:800;
  box-shadow:inset 0 -3px 0 #1f150c,0 3px 0 #6b4f2e;
  min-width:60px;text-align:center;
}

/* 进度条 */
.progress-track{height:7px;background:#1a1208;position:relative;overflow:hidden;}
.progress-fill{
  height:100%;
  background:linear-gradient(90deg,#b8860b,#ffd700,#ffec80);
  width:0%;transition:width 0.5s cubic-bezier(0.34,1.56,0.64,1);
  box-shadow:0 0 12px rgba(255,215,0,0.7);
}

/* 模式选择 */
.mode-select{
  padding:16px 20px 8px;
  display:flex;justify-content:center;gap:12px;flex-wrap:wrap;
}
.mode-btn{
  padding:10px 26px;border-radius:40px;
  border:2px solid #c9a96a;
  background:linear-gradient(180deg,#fffef9,#f5ecd6);
  color:#5c4a2e;font-weight:700;font-size:0.95rem;
  cursor:pointer;font-family:'华文楷体','KaiTi',serif;
  letter-spacing:1px;transition:all 0.15s;
  box-shadow:0 3px 0 #a88a52;
}
.mode-btn:hover{transform:translateY(-2px);box-shadow:0 5px 0 #a88a52;background:#fff8e7;}
.mode-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #a88a52;}
.mode-btn.active{
  background:linear-gradient(180deg,#ffd700,#e6a800);
  color:#3d2b10;border-color:#b8860b;
  box-shadow:0 3px 0 #8a6500,0 0 20px rgba(255,215,0,0.4);
}

/* 主题/年级标签选择 */
.topic-select{
  padding:6px 20px 10px;
  display:flex;justify-content:center;gap:8px;flex-wrap:wrap;
  min-height:44px;
}
.topic-btn{
  padding:6px 18px;border-radius:30px;
  border:1.5px solid #cdb894;
  background:rgba(255,255,255,0.5);
  color:#6b5a3e;font-weight:600;font-size:0.85rem;
  cursor:pointer;font-family:'华文楷体','KaiTi',serif;
  transition:all 0.15s;
}
.topic-btn:hover{background:#fff8e7;border-color:#b8955a;}
.topic-btn.active{
  background:linear-gradient(180deg,#8d6e63,#5d4037);
  color:#f5e6c8;border-color:#3e2723;
  box-shadow:0 0 12px rgba(141,110,99,0.5);
}

/* 题目区 */
.quiz-area{
  margin:0 16px;
  background:linear-gradient(180deg,#fffdf7,#fdf6e3);
  border-radius:22px;
  padding:24px 24px 18px;
  box-shadow:inset 0 0 0 2px #d4b87a,inset 0 0 35px rgba(200,160,90,0.1),0 8px 20px rgba(0,0,0,0.1);
  border:1px solid #c9a96a;
  position:relative;
  min-height:280px;
}

/* 来源标签 */
.source-tag{
  display:inline-block;
  background:linear-gradient(90deg,#5d4037,#8d6e63);
  color:#f5e6c8;
  padding:4px 16px;border-radius:20px;
  font-size:0.78rem;font-weight:700;
  letter-spacing:1px;
  margin-bottom:14px;
  box-shadow:0 2px 8px rgba(93,64,55,0.3);
}

/* 题目提示 */
.question-hint{
  font-size:0.9rem;color:#8d6e63;
  margin-bottom:12px;font-weight:600;
  letter-spacing:1px;
  display:flex;align-items:center;gap:6px;
}

/* 原文展示 */
.poem-display{
  font-size:1.7rem;
  color:#2c1e0e;
  text-align:center;
  line-height:1.9;
  margin:10px 0 22px;
  font-weight:600;
  letter-spacing:2px;
  text-shadow:1px 1px 0 rgba(200,170,120,0.2);
  min-height:5rem;
  padding:0 10px;
}
.poem-blank{
  display:inline-block;
  min-width:110px;
  border-bottom:3px solid #b8860b;
  margin:0 8px;
  padding:0 6px;
  color:#b8860b;
  font-weight:800;
  text-align:center;
  background:linear-gradient(to right,transparent,rgba(255,215,0,0.15),transparent);
  border-radius:3px;
  animation:blankGlow 1.2s ease-in-out infinite;
}
@keyframes blankGlow{
  0%,100%{background:linear-gradient(to right,transparent,rgba(255,215,0,0.15),transparent);}
  50%{background:linear-gradient(to right,transparent,rgba(255,215,0,0.35),transparent);border-bottom-color:#ffd700;}
}

/* 输入区域 */
.input-area{
  display:flex;gap:10px;align-items:center;
  max-width:600px;margin:0 auto 16px;
}
.answer-input{
  flex:1;
  padding:16px 20px;
  font-size:1.3rem;
  font-family:'华文楷体','KaiTi',serif;
  color:#2c1e0e;
  background:#fffef9;
  border:3px solid #cdb894;
  border-radius:16px;
  outline:none;
  transition:all 0.2s;
  letter-spacing:2px;
  text-align:center;
  box-shadow:inset 0 2px 6px rgba(120,90,50,0.1);
}
.answer-input:focus{
  border-color:#ffd700;
  box-shadow:inset 0 2px 6px rgba(120,90,50,0.1),0 0 0 3px rgba(255,215,0,0.25);
  background:#fff;
}
.answer-input:disabled{opacity:0.6;cursor:not-allowed;}
.answer-input.correct-input{
  border-color:#2e7d32;background:#e8f5e9;
  box-shadow:0 0 20px rgba(76,175,80,0.4);
}
.answer-input.wrong-input{
  border-color:#c62828;background:#ffebee;
  box-shadow:0 0 20px rgba(244,67,54,0.3);
  animation:inputShake 0.4s ease;
}
@keyframes inputShake{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-8px);}
  40%{transform:translateX(8px);}
  60%{transform:translateX(-5px);}
  80%{transform:translateX(5px);}
}

.submit-btn{
  padding:16px 30px;
  font-size:1.1rem;font-weight:700;
  font-family:'华文楷体','KaiTi',serif;
  color:#fff;
  background:linear-gradient(180deg,#4caf50,#2e7d32);
  border:none;border-radius:16px;
  cursor:pointer;letter-spacing:2px;
  box-shadow:0 4px 0 #1b5e20,0 6px 14px rgba(0,0,0,0.2);
  transition:all 0.12s;white-space:nowrap;
}
.submit-btn:hover:not(:disabled){
  transform:translateY(-2px);
  box-shadow:0 6px 0 #1b5e20,0 10px 20px rgba(0,0,0,0.25);
  background:linear-gradient(180deg,#66bb6a,#388e3c);
}
.submit-btn:active:not(:disabled){
  transform:translateY(3px);
  box-shadow:0 1px 0 #1b5e20,0 4px 10px rgba(0,0,0,0.15);
}
.submit-btn:disabled{opacity:0.5;cursor:default;transform:translateY(2px);box-shadow:0 2px 0 #1b5e20;}

/* 反馈 */
.feedback-msg{
  text-align:center;
  font-size:1.15rem;font-weight:700;
  min-height:2.6rem;
  padding:8px;border-radius:14px;
  transition:all 0.3s;
  display:flex;align-items:center;justify-content:center;
  gap:8px;letter-spacing:1px;
}
.feedback-msg.success{color:#2e7d32;background:rgba(76,175,80,0.1);}
.feedback-msg.error{color:#c62828;background:rgba(244,67,54,0.08);}

/* 答案提示 */
.answer-reveal{
  text-align:center;
  font-size:1rem;
  color:#8d6e63;
  margin-top:6px;
  font-weight:600;
  letter-spacing:1px;
  min-height:1.5rem;
}
.answer-reveal b{color:#b8860b;font-size:1.1rem;}

/* 操作栏 */
.action-bar{
  display:flex;justify-content:center;gap:14px;
  margin-top:16px;flex-wrap:wrap;
}
.btn{
  border:none;padding:13px 32px;
  font-size:1.05rem;font-weight:700;
  border-radius:50px;cursor:pointer;
  letter-spacing:2px;
  font-family:'华文楷体','KaiTi',serif;
  transition:all 0.12s;
  min-width:140px;
  border:2px solid rgba(255,255,255,0.15);
}
.btn-skip{
  background:linear-gradient(180deg,#ff9800,#e65100);
  color:#fff;
  box-shadow:0 4px 0 #bf360c,0 6px 14px rgba(0,0,0,0.2);
}
.btn-skip:hover:not(:disabled){
  transform:translateY(-2px);
  box-shadow:0 6px 0 #bf360c,0 10px 20px rgba(0,0,0,0.25);
}
.btn-skip:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #bf360c;}
.btn-skip:disabled{opacity:0.45;transform:translateY(2px);box-shadow:0 2px 0 #bf360c;cursor:default;}

.btn-restart{
  background:linear-gradient(180deg,#8d6e63,#5d4037);
  color:#fff;
  box-shadow:0 4px 0 #3e2723,0 6px 14px rgba(0,0,0,0.2);
}
.btn-restart:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 0 #3e2723,0 10px 20px rgba(0,0,0,0.25);
}
.btn-restart:active{transform:translateY(3px);box-shadow:0 1px 0 #3e2723;}

/* 浮动得分 */
.float-score{
  position:fixed;
  font-size:2rem;font-weight:900;
  color:#ffd700;
  text-shadow:0 0 15px #ff8f00,0 0 30px #ff6f00;
  pointer-events:none;z-index:999;
  animation:floatUp 1.1s ease-out forwards;
}
@keyframes floatUp{
  0%{opacity:1;transform:translateY(0) scale(1);}
  100%{opacity:0;transform:translateY(-90px) scale(1.5);}
}

/* 彩带 */
.confetti{
  position:fixed;width:10px;height:10px;
  pointer-events:none;z-index:998;
  animation:confettiFall 2s ease-out forwards;
}
@keyframes confettiFall{
  0%{opacity:1;transform:translateY(0) rotate(0deg) scale(1);}
  100%{opacity:0;transform:translateY(80vh) rotate(720deg) scale(0.5);}
}

/* 结算弹窗 */
.overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.75);
  display:flex;align-items:center;justify-content:center;
  z-index:100;opacity:0;pointer-events:none;
  transition:opacity 0.4s;backdrop-filter:blur(5px);
}
.overlay.show{opacity:1;pointer-events:auto;}
.result-card{
  background:linear-gradient(170deg,#fff8e1,#ffe082,#ffd54f);
  border-radius:28px;padding:36px 40px;
  text-align:center;
  box-shadow:0 0 70px rgba(255,215,0,0.8),0 20px 50px rgba(0,0,0,0.5);
  border:4px solid #ffb300;
  transform:scale(0.7);
  transition:transform 0.5s cubic-bezier(0.34,1.56,0.64,1);
  max-width:400px;width:90%;
}
.overlay.show .result-card{transform:scale(1);}
.result-emoji{font-size:4rem;display:block;animation:resultBounce 0.8s ease infinite alternate;}
@keyframes resultBounce{
  from{transform:translateY(0) scale(1);}
  to{transform:translateY(-12px) scale(1.1);}
}
.result-title{
  font-size:1.5rem;color:#e65100;
  margin:12px 0 8px;font-weight:800;letter-spacing:3px;
}
.result-stats{
  font-size:1rem;color:#bf360c;
  margin-bottom:20px;line-height:2;
}
.result-stats b{color:#e65100;font-size:1.3rem;}
.btn-result{
  background:linear-gradient(180deg,#ff8f00,#e65100);
  border:none;padding:12px 44px;
  font-size:1.1rem;font-weight:700;
  color:#fff;border-radius:50px;
  cursor:pointer;letter-spacing:2px;
  font-family:'华文楷体','KaiTi',serif;
  box-shadow:0 5px 0 #bf360c,0 8px 16px rgba(0,0,0,0.3);
  transition:all 0.12s;
}
.btn-result:hover{transform:translateY(-2px);box-shadow:0 7px 0 #bf360c,0 12px 24px rgba(0,0,0,0.35);}
.btn-result:active{transform:translateY(3px);box-shadow:0 1px 0 #bf360c;}

/* 空状态 */
.empty-state{
  text-align:center;
  padding:40px 20px;
  color:#8d6e63;
  font-size:1.1rem;
  line-height:2;
}
.empty-state .big{font-size:3rem;display:block;margin-bottom:10px;}

@media(max-width:600px){
  .game-wrap{border-radius:22px;}
  .top-bar{padding:10px 12px;}
  .mode-icon{width:34px;height:34px;font-size:1.1rem;}
  .mode-name{font-size:0.85rem;}
  .timer-value{font-size:1.2rem;min-width:48px;}
  .score-num{font-size:1rem;padding:3px 12px;min-width:48px;}
  .quiz-area{padding:16px 14px 12px;margin:0 10px;}
  .poem-display{font-size:1.25rem;min-height:4rem;}
  .poem-blank{min-width:80px;}
  .input-area{flex-direction:column;gap:8px;}
  .answer-input{width:100%;font-size:1.1rem;padding:13px 16px;}
  .submit-btn{width:100%;padding:14px;}
  .btn{padding:11px 20px;font-size:0.9rem;min-width:110px;}
  .mode-btn{padding:8px 18px;font-size:0.82rem;}
  .topic-btn{padding:5px 14px;font-size:0.78rem;}
}
</style>
</head>
<body>

<div class="game-wrap">
  <!-- 顶部栏 -->
  <div class="top-bar">
    <div class="mode-badge">
      <div class="mode-icon" id="modeIcon">📚</div>
      <div>
        <div class="mode-name" id="modeName">年级闯关</div>
        <div class="mode-sub" id="modeSub">七年级 · 上册</div>
      </div>
    </div>
    <div class="timer-box">
      <span>⏱️</span>
      <span class="timer-value" id="timerDisplay">--</span>
    </div>
    <div class="score-box">
      <span>⭐</span>
      <span class="score-num" id="scoreDisplay">0</span>
    </div>
  </div>

  <!-- 进度条 -->
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <!-- 模式选择 -->
  <div class="mode-select" id="modeSelect">
    <button class="mode-btn active" data-mode="grade">📖 年级闯关</button>
    <button class="mode-btn" data-mode="topic">🎯 主题挑战</button>
  </div>

  <!-- 主题/年级标签 -->
  <div class="topic-select" id="topicSelect"></div>

  <!-- 答题区 -->
  <div class="quiz-area" id="quizArea">
    <div id="quizContent"></div>
  </div>

  <!-- 操作栏 -->
  <div class="action-bar">
    <button class="btn btn-skip" id="skipBtn" disabled>⏭️ 跳过本题</button>
    <button class="btn btn-restart" id="restartBtn">🔄 重新开始</button>
  </div>
</div>

<!-- 结算弹窗 -->
<div class="overlay" id="resultOverlay">
  <div class="result-card">
    <span class="result-emoji" id="resultEmoji">🏆</span>
    <div class="result-title" id="resultTitle">挑战完成！</div>
    <div class="result-stats" id="resultStats"></div>
    <button class="btn-result" id="resultBtn">再来一次</button>
  </div>
</div>

<script>
(function(){
  // ============================================================
  // 题库 —— 部编版初中语文必背古诗文
  // 每题包含：source(出处)、display(展示的诗句，用______表示待填)、
  // answer(正确答案)、type('next'填下句/'prev'填上句)、
  // grade(年级)、topic(主题)
  // ============================================================
  const questionBank = [
    // ---------- 七年级 ----------
    { source:"《观沧海》曹操", display:"日月之行，若出其中；______，若出其里。", answer:"星汉灿烂", type:"next", grade:"七年级", topic:"壮志豪情" },
    { source:"《观沧海》曹操", display:"______，以观沧海。", answer:"东临碣石", type:"prev", grade:"七年级", topic:"壮志豪情" },
    { source:"《闻王昌龄左迁龙标遥有此寄》李白", display:"我寄愁心与明月，______。", answer:"随君直到夜郎西", type:"next", grade:"七年级", topic:"友情送别" },
    { source:"《闻王昌龄左迁龙标遥有此寄》李白", display:"______，闻道龙标过五溪。", answer:"杨花落尽子规啼", type:"prev", grade:"七年级", topic:"友情送别" },
    { source:"《次北固山下》王湾", display:"潮平两岸阔，______。", answer:"风正一帆悬", type:"next", grade:"七年级", topic:"思乡怀人" },
    { source:"《次北固山下》王湾", display:"______，江春入旧年。", answer:"海日生残夜", type:"prev", grade:"七年级", topic:"思乡怀人" },

    { source:"《天净沙·秋思》马致远", display:"夕阳西下，______。", answer:"断肠人在天涯", type:"next", grade:"七年级", topic:"思乡怀人" },

    { source:"《山坡羊·潼关怀古》张养浩", display:"______，波涛如怒。", answer:"峰峦如聚", type:"prev", grade:"九年级", topic:"咏史怀古" },

  // ============================================================
  // 游戏状态
  // ============================================================
  let currentMode = 'grade';           // 'grade' 或 'topic'
  let currentFilter = '七年级';         // 当前筛选：年级名或主题名
  let questionQueue = [];              // 当前题目队列（随机打乱后）
  let currentIndex = 0;                // 当前题目在队列中的索引
  let score = 0;                       // 总得分
  let correctCount = 0;                // 答对数量
  let totalAnswered = 0;               // 已答题数
  let answered = false;                // 当前题是否已作答
  let timerInterval = null;            // 计时器
  let timeLeft = 0;                    // 剩余时间（秒）
  let timerEnabled = true;             // 是否开启计时
  let comboCount = 0;                  // 连击数

  // DOM 元素
  const modeIcon = document.getElementById('modeIcon');
  const modeName = document.getElementById('modeName');
  const modeSub = document.getElementById('modeSub');
  const timerDisplay = document.getElementById('timerDisplay');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const progressFill = document.getElementById('progressFill');
  const modeSelect = document.getElementById('modeSelect');
  const topicSelect = document.getElementById('topicSelect');
  const quizContent = document.getElementById('quizContent');
  const skipBtn = document.getElementById('skipBtn');
  const restartBtn = document.getElementById('restartBtn');
  const resultOverlay = document.getElementById('resultOverlay');
  const resultEmoji = document.getElementById('resultEmoji');
  const resultTitle = document.getElementById('resultTitle');
  const resultStats = document.getElementById('resultStats');
  const resultBtn = document.getElementById('resultBtn');

  // ============================================================
  // 工具函数
  // ============================================================

  // 打乱数组
  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // 标准化字符串：去除标点、空格，用于答案匹配
  function normalize(str) {
    return str.replace(/[\s，。！？；：、,.!?;:'"“”‘’（）()《》【】—…·\-]/g, '').trim();
  }

  // 判断答案是否正确（支持多答案，用/分隔）
  function checkAnswer(userAnswer, correctAnswer) {
    const user = normalize(userAnswer);
    const corrects = correctAnswer.split('/').map(s => normalize(s));
    return corrects.includes(user);
  }

  // 获取筛选后的题目
  function getFilteredQuestions(mode, filter) {
    if (mode === 'grade') {
      return questionBank.filter(q => q.grade === filter);
    } else {
      return questionBank.filter(q => q.topic === filter);
    }
  }

  // 获取所有年级
  function getAllGrades() {
    return [...new Set(questionBank.map(q => q.grade))];
  }

  // 获取所有主题
  function getAllTopics() {
    return [...new Set(questionBank.map(q => q.topic))];
  }

  // ============================================================
  // 界面渲染
  // ============================================================

  // 渲染筛选标签
  function renderTopicSelect() {
    topicSelect.innerHTML = '';
    let items = [];
    if (currentMode === 'grade') {
      items = getAllGrades();
    } else {
      items = getAllTopics();
    }

    items.forEach(item => {
      const btn = document.createElement('button');
      btn.className = 'topic-btn' + (item === currentFilter ? ' active' : '');
      btn.textContent = item;
      btn.addEventListener('click', () => {
        currentFilter = item;
        renderTopicSelect();
        startSession();
      });
      topicSelect.appendChild(btn);
    });
  }

  // 更新模式显示
  function updateModeDisplay() {
    if (currentMode === 'grade') {
      modeIcon.textContent = '📚';
      modeName.textContent = '年级闯关';
      modeSub.textContent = currentFilter;
    } else {
      modeIcon.textContent = '🎯';
      modeName.textContent = '主题挑战';
      modeSub.textContent = currentFilter;
    }
  }

  // 更新进度条
  function updateProgress() {
    const total = questionQueue.length;
    const done = currentIndex;
    const pct = total > 0 ? (done / total) * 100 : 0;
    progressFill.style.width = pct + '%';
  }

  // ============================================================
  // 计时器
  // ============================================================
  function startTimer(seconds) {
    stopTimer();
    timeLeft = seconds;
    timerEnabled = true;
    updateTimerDisplay();
    timerInterval = setInterval(() => {
      timeLeft--;
      updateTimerDisplay();
      if (timeLeft <= 0) {
        stopTimer();
        // 时间到，自动判错
        if (!answered) {
          handleTimeout();
        }
      }
    }, 1000);
  }

  function stopTimer() {
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
  }

  function updateTimerDisplay() {
    if (!timerEnabled) {
      timerDisplay.textContent = '--';
      timerDisplay.classList.remove('warning');
      return;
    }
    const m = Math.floor(timeLeft / 60);
    const s = timeLeft % 60;
    timerDisplay.textContent = `${m}:${s.toString().padStart(2,'0')}`;
    if (timeLeft <= 10) {
      timerDisplay.classList.add('warning');
    } else {
      timerDisplay.classList.remove('warning');
    }
  }

  // 超时处理
  function handleTimeout() {
    if (answered) return;
    answered = true;
    stopTimer();

    const input = document.querySelector('.answer-input');
    const submitBtn = document.querySelector('.submit-btn');
    if (input) input.disabled = true;
    if (submitBtn) submitBtn.disabled = true;

    // 显示正确答案
    const q = questionQueue[currentIndex];
    showAnswerReveal(q.answer);

    // 标记为错误
    if (input) input.classList.add('wrong-input');
    const fb = document.querySelector('.feedback-msg');
    if (fb) {
      fb.textContent = '⏰ 时间到！正确答案已显示';
      fb.className = 'feedback-msg error';
    }

    comboCount = 0;
    skipBtn.disabled = false;
    skipBtn.textContent = '下一题 ➡️';
    skipBtn.onclick = () => nextQuestion();
  }

  // ============================================================
  // 答题逻辑
  // ============================================================

  // 开始一轮（根据当前模式和筛选）
  function startSession() {
    stopTimer();
    const filtered = getFilteredQuestions(currentMode, currentFilter);
    if (filtered.length === 0) {
      quizContent.innerHTML = '<div class="empty-state"><span class="big">📭</span>该分类下暂无题目</div>';
      skipBtn.disabled = true;
      return;
    }
    questionQueue = shuffle(filtered);
    currentIndex = 0;
    score = 0;
    correctCount = 0;
    totalAnswered = 0;
    comboCount = 0;
    scoreDisplay.textContent = '0';
    updateProgress();
    updateModeDisplay();
    loadQuestion();
  }

  // 加载当前题目
  function loadQuestion() {
    if (currentIndex >= questionQueue.length) {
      showResult();
      return;
    }

    answered = false;
    const q = questionQueue[currentIndex];

    // 构建界面
    quizContent.innerHTML = `
      <div class="source-tag">📜 ${q.source}</div>
      <div class="question-hint">
        <span>${q.type === 'next' ? '👉 请填写下一句' : '👈 请填写上一句'}</span>
      </div>
      <div class="poem-display" id="poemDisplay"></div>
      <div class="input-area">
        <input type="text" class="answer-input" id="answerInput"
               placeholder="输入诗句…" autocomplete="off" spellcheck="false" />
        <button class="submit-btn" id="submitBtn">✔ 确认</button>
      </div>
      <div class="feedback-msg" id="feedbackMsg"></div>
      <div class="answer-reveal" id="answerReveal"></div>
    `;

    // 渲染诗句（将______替换为高亮）
    const poemDisplay = document.getElementById('poemDisplay');
    const rawText = q.display;
    // 转义HTML
    let safe = rawText
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    safe = safe.replace(/_{3,}/g, '<span class="poem-blank">______</span>');
    poemDisplay.innerHTML = safe;

    // 绑定事件
    const input = document.getElementById('answerInput');
    const submitBtn = document.getElementById('submitBtn');

    submitBtn.addEventListener('click', () => submitAnswer());
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        submitAnswer();
      }
    });

    // 计时（每题20秒）
    startTimer(20);

    // 跳过按钮状态
    skipBtn.disabled = true;
    skipBtn.textContent = '⏭️ 跳过本题';
    skipBtn.onclick = () => {
      if (!answered) {
        // 跳过算错
        answered = true;
        stopTimer();
        const inp = document.querySelector('.answer-input');
        const sb = document.querySelector('.submit-btn');
        if (inp) inp.disabled = true;
        if (sb) sb.disabled = true;
        showAnswerReveal(q.answer);
        const fb = document.querySelector('.feedback-msg');
        if (fb) { fb.textContent = '⏭️ 已跳过'; fb.className = 'feedback-msg error'; }
        comboCount = 0;
      }
      skipBtn.disabled = false;
      skipBtn.textContent = '下一题 ➡️';
      skipBtn.onclick = () => nextQuestion();
    };

    // 自动聚焦输入框
    setTimeout(() => input.focus(), 100);
    updateProgress();
  }

  // 提交答案
  function submitAnswer() {
    if (answered) return;
    const q = questionQueue[currentIndex];
    const input = document.getElementById('answerInput');
    const submitBtn = document.getElementById('submitBtn');
    const fb = document.getElementById('feedbackMsg');
    const userAnswer = input.value.trim();

    if (!userAnswer) {
      fb.textContent = '✏️ 请先输入答案';
      fb.className = 'feedback-msg error';
      input.focus();
      return;
    }

    answered = true;
    stopTimer();
    input.disabled = true;
    submitBtn.disabled = true;

    const isCorrect = checkAnswer(userAnswer, q.answer);
    totalAnswered++;

    if (isCorrect) {
      // 答对
      correctCount++;
      comboCount++;

      // 基础分10分 + 连击奖励
      const comboBonus = Math.min(comboCount - 1, 5) * 3;
      const timeBonus = Math.max(0, Math.floor(timeLeft / 4));
      const gain = 10 + comboBonus + timeBonus;
      score += gain;
      scoreDisplay.textContent = score;

      input.classList.add('correct-input');
      fb.innerHTML = `✅ 正确！+${gain}分 ${comboCount > 1 ? `🔥${comboCount}连击` : ''}`;
      fb.className = 'feedback-msg success';

      showFloatScore('+' + gain);
      if (comboCount >= 3) spawnConfetti(15);
    } else {
      // 答错
      comboCount = 0;
      input.classList.add('wrong-input');
      fb.innerHTML = `❌ 答错了，正确答案已显示`;
      fb.className = 'feedback-msg error';
      showAnswerReveal(q.answer);
    }

    // 显示正确答案（答对也显示，加深记忆）
    if (isCorrect) showAnswerReveal(q.answer, true);

    skipBtn.disabled = false;
    skipBtn.textContent = '下一题 ➡️';
    skipBtn.onclick = () => nextQuestion();
  }

  // 显示正确答案
  function showAnswerReveal(answer, success) {
    const el = document.getElementById('answerReveal');
    if (el) {
      el.innerHTML = `📖 正确答案：<b>${answer}</b>`;
      if (success) el.style.color = '#2e7d32';
      else el.style.color = '#8d6e63';
    }
  }

  // 下一题
  function nextQuestion() {
    currentIndex++;
    updateProgress();
    loadQuestion();
  }

  // 浮动得分
  function showFloatScore(text) {
    const el = document.createElement('div');
    el.className = 'float-score';
    el.textContent = text;
    el.style.left = (window.innerWidth / 2 - 40) + 'px';
    el.style.top = (window.innerHeight / 2 - 60) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1100);
  }

  // 彩带
  function spawnConfetti(count) {
    const colors = ['#ffd700','#ff6b6b','#4ecdc4','#ffe66d','#a8e6cf','#ff8b94','#b5e2ff'];
    for (let i = 0; i < count; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + '%';
      c.style.top = '-20px';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.width = (Math.random() * 8 + 5) + 'px';
      c.style.height = (Math.random() * 8 + 5) + 'px';
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      c.style.animationDuration = (Math.random() * 1.5 + 1.5) + 's';
      c.style.animationDelay = (Math.random() * 0.5) + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 3000);
    }
  }

  // ============================================================
  // 结算
  // ============================================================
  function showResult() {
    stopTimer();
    const total = questionQueue.length;
    const accuracy = total > 0 ? Math.round((correctCount / total) * 100) : 0;

    let emoji, title;
    if (accuracy >= 90) { emoji = '🏆'; title = '诗仙级表现！'; }
    else if (accuracy >= 70) { emoji = '🥈'; title = '诗圣级表现！'; }
    else if (accuracy >= 50) { emoji = '🥉'; title = '诗童级表现！'; }
    else { emoji = '📖'; title = '继续加油！'; }

    resultEmoji.textContent = emoji;
    resultTitle.textContent = title;
    resultStats.innerHTML = `
      总题数：<b>${total}</b> 题<br>
      答对：<b>${correctCount}</b> 题<br>
      正确率：<b>${accuracy}%</b><br>
      总得分：<b>${score}</b> 分
    `;
    resultOverlay.classList.add('show');
  }

  // ============================================================
  // 事件绑定
  // ============================================================
  function init() {
    // 模式切换
    modeSelect.addEventListener('click', (e) => {
      const btn = e.target.closest('.mode-btn');
      if (!btn) return;
      const mode = btn.dataset.mode;
      if (mode === currentMode) return;

      currentMode = mode;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      // 重置筛选为该模式的第一个选项
      if (mode === 'grade') {
        currentFilter = getAllGrades()[0];
      } else {
        currentFilter = getAllTopics()[0];
      }

      renderTopicSelect();
      updateModeDisplay();
      startSession();
    });

    // 重新开始
    restartBtn.addEventListener('click', () => {
      resultOverlay.classList.remove('show');
      startSession();
    });

    // 结算弹窗按钮
    resultBtn.addEventListener('click', () => {
      resultOverlay.classList.remove('show');
      startSession();
    });

    // 初始化
    renderTopicSelect();
    updateModeDisplay();
    startSession();

    // 墨点特效
    setInterval(() => {
      const dot = document.createElement('div');
      dot.className = 'ink-dot';
      const size = Math.random() * 12 + 4;
      dot.style.width = size + 'px';
      dot.style.height = size + 'px';
      dot.style.left = Math.random() * 100 + '%';
      dot.style.animationDuration = (Math.random() * 8 + 8) + 's';
      dot.style.animationDelay = Math.random() * 3 + 's';
      document.body.appendChild(dot);
      setTimeout(() => dot.remove(), 18000);
    }, 800);
  }

  init();
})();
</script>
</body>
</html>
