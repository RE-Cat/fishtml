<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>诗词雅集 · 初中古诗游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #1e2b1c, #0f130e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: '华文楷体', 'KaiTi', 'Microsoft YaHei', 'Segoe UI', serif;
            padding: 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* 飘落花瓣效果 */
        .petal {
            position: fixed;
            top: -10px;
            width: 20px;
            height: 20px;
            background: rgba(255, 200, 210, 0.7);
            border-radius: 80% 0 80% 0;
            transform: rotate(45deg);
            pointer-events: none;
            z-index: 0;
            animation: fall linear infinite;
            box-shadow: 0 0 8px rgba(255, 180, 200, 0.5);
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0.1; }
        }

        .game-wrapper {
            position: relative;
            z-index: 2;
            max-width: 820px;
            width: 100%;
            background: linear-gradient(145deg, #fef9e8, #f6ecd6);
            border-radius: 60px 60px 40px 40px;
            box-shadow: 0 35px 45px rgba(0, 0, 0, 0.7), inset 0 0 0 3px #e6d3ae, inset 0 0 40px #dac29b;
            padding: 30px 28px 30px;
            border: 1px solid #b8a77c;
            transition: transform 0.2s ease;
        }

        /* 顶部装饰 */
        .game-header {
            text-align: center;
            margin-bottom: 12px;
        }

        .game-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #362713;
            text-shadow: 4px 4px 0 #d9c48b, 2px 2px 0 #b38b5b;
            letter-spacing: 8px;
            font-family: '华文楷体', 'KaiTi', 'Times New Roman', serif;
            display: inline-block;
            padding: 0 20px 8px;
            border-bottom: 5px double #b8a77c;
        }

        .subhead {
            font-size: 1rem;
            color: #6b5a3e;
            margin-top: 6px;
            font-style: italic;
            letter-spacing: 3px;
        }

        /* 计分板 + 进度 */
        .stats-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin: 18px 0 14px;
            flex-wrap: wrap;
        }

        .score-box, .progress-box {
            background: #e8ddc7;
            padding: 6px 24px;
            border-radius: 60px;
            border: 1px solid #c7b289;
            box-shadow: inset 0 2px 5px rgba(120, 90, 50, 0.2), 0 4px 0 #9b8a68;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 160px;
            justify-content: center;
        }

        .score-value {
            background: #3e2e1c;
            color: #f7e9cf;
            padding: 4px 18px;
            border-radius: 40px;
            font-size: 1.5rem;
            letter-spacing: 1px;
            box-shadow: inset 0 -3px 0 #1f150c, 0 3px 0 #6b4f2e;
            font-weight: 700;
            min-width: 70px;
            text-align: center;
        }

        .progress-value {
            background: #5d7a4b;
            color: #fef7e9;
            padding: 4px 18px;
            border-radius: 40px;
            font-size: 1.2rem;
            font-weight: 700;
            box-shadow: inset 0 -3px 0 #34462a, 0 3px 0 #3a5530;
        }

        /* 主要卡片 */
        .quiz-card {
            background: #fffcf3;
            border-radius: 40px;
            padding: 30px 25px 20px;
            box-shadow: inset 0 0 0 1px #f0e3cc, inset 0 0 25px #e7d7bd, 0 12px 18px -8px rgba(60, 40, 20, 0.5);
            border-bottom: 8px solid #dac29b;
            margin: 12px 0;
            transition: box-shadow 0.2s;
        }

        .question-text {
            font-size: 1.9rem;
            font-weight: 500;
            color: #2e2216;
            text-align: center;
            line-height: 1.6;
            margin: 5px 0 25px;
            font-family: '华文楷体', 'KaiTi', 'Georgia', serif;
            min-height: 6rem;
            word-break: break-word;
            padding: 0 8px;
            text-shadow: 1px 1px 0 rgba(200, 170, 120, 0.3);
        }

        .highlight-blank {
            display: inline-block;
            min-width: 120px;
            border-bottom: 4px solid #b38b5b;
            margin: 0 8px;
            padding: 0 6px;
            color: #b8863d;
            font-weight: 700;
            letter-spacing: 2px;
            text-align: center;
            background: linear-gradient(to right, transparent, #f5e8d3, transparent);
            border-radius: 4px;
            animation: pulseGlow 1.5s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0% { background: linear-gradient(to right, transparent, #f5e8d3, transparent); }
            50% { background: linear-gradient(to right, transparent, #f7d9a8, transparent); border-bottom-color: #dbaa5e; }
            100% { background: linear-gradient(to right, transparent, #f5e8d3, transparent); }
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin: 26px 0 18px;
        }

        .option-btn {
            background: #f2eadb;
            border: 2px solid #cdb894;
            border-radius: 60px;
            padding: 18px 8px;
            font-size: 1.3rem;
            font-weight: 600;
            color: #3e2e1c;
            font-family: '华文楷体', 'KaiTi', 'Segoe UI', serif;
            cursor: pointer;
            box-shadow: 0 6px 0 #a48e6b, 0 10px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.08s ease;
            letter-spacing: 1px;
            text-align: center;
            line-height: 1.3;
            word-break: break-word;
            position: relative;
            transform: translateY(0);
        }

        .option-btn:hover:not(:disabled) {
            background: #faf1e2;
            transform: translateY(-3px);
            box-shadow: 0 9px 0 #a48e6b, 0 12px 20px rgba(0, 0, 0, 0.2);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #a48e6b, 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .option-btn.correct {
            background: #b8e0b8;
            border-color: #2d6b2d;
            color: #1a4a1a;
            box-shadow: 0 6px 0 #2d6b2d, 0 8px 15px rgba(0, 0, 0, 0.2);
            animation: correctPop 0.3s ease;
        }

        .option-btn.wrong {
            background: #f3c6c6;
            border-color: #b33b3b;
            color: #6b1f1f;
            box-shadow: 0 6px 0 #8f3a3a, 0 8px 15px rgba(0, 0, 0, 0.2);
            animation: wrongShake 0.3s ease;
        }

        .option-btn:disabled {
            opacity: 0.9;
            cursor: not-allowed;
            transform: translateY(3px);
            box-shadow: 0 3px 0 #8f7b5c, 0 6px 8px rgba(0, 0, 0, 0.1);
        }

        @keyframes correctPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes wrongShake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            50% { transform: translateX(6px); }
            75% { transform: translateX(-3px); }
            100% { transform: translateX(0); }
        }

        .feedback {
            text-align: center;
            font-size: 1.3rem;
            min-height: 3.2rem;
            margin: 8px 0 8px;
            font-weight: 700;
            letter-spacing: 1px;
            transition: all 0.2s;
            padding: 8px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .feedback.success {
            color: #1f6b1f;
            background: rgba(140, 200, 140, 0.2);
        }

        .feedback.error {
            color: #a13d3d;
            background: rgba(220, 160, 160, 0.2);
        }

        /* 按钮组 */
        .action-row {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            padding: 16px 40px;
            font-size: 1.3rem;
            font-weight: 700;
            border-radius: 60px;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.1s ease;
            font-family: '华文楷体', 'KaiTi', 'Segoe UI', serif;
            border: 1px solid #a5b88b;
            box-shadow: 0 7px 0 #34462a, 0 10px 18px rgba(0, 0, 0, 0.35);
            min-width: 180px;
        }

        .btn-next {
            background: #5d7a4b;
            color: #fef7e9;
        }

        .btn-next:hover:not(:disabled) {
            background: #6b8b57;
            transform: translateY(-3px);
            box-shadow: 0 10px 0 #34462a, 0 14px 22px rgba(0, 0, 0, 0.35);
        }

        .btn-next:active:not(:disabled) {
            transform: translateY(5px);
            box-shadow: 0 2px 0 #34462a, 0 7px 12px rgba(0, 0, 0, 0.25);
        }

        .btn-next:disabled {
            opacity: 0.5;
            transform: translateY(4px);
            box-shadow: 0 3px 0 #34462a;
            cursor: default;
        }

        .btn-restart {
            background: #9e7e5e;
            color: #fef7e9;
            box-shadow: 0 7px 0 #5e4a36, 0 10px 18px rgba(0, 0, 0, 0.35);
            border-color: #c7b289;
        }

        .btn-restart:hover {
            background: #b08e6a;
            transform: translateY(-3px);
            box-shadow: 0 10px 0 #5e4a36, 0 14px 22px rgba(0, 0, 0, 0.35);
        }

        .btn-restart:active {
            transform: translateY(5px);
            box-shadow: 0 2px 0 #5e4a36, 0 7px 12px rgba(0, 0, 0, 0.25);
        }

        /* 浮动提示 */
        .floating-score {
            position: fixed;
            font-size: 2rem;
            font-weight: 800;
            color: #ffd966;
            text-shadow: 0 0 15px #ffaa33, 0 0 30px #ff8800;
            pointer-events: none;
            z-index: 999;
            animation: floatUp 1s ease-out forwards;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-100px) scale(1.4); }
        }

        .footer-note {
            text-align: center;
            color: #7a6b53;
            margin-top: 22px;
            font-size: 0.85rem;
            letter-spacing: 2px;
            border-top: 1px dashed #c7b289;
            padding-top: 16px;
            font-style: italic;
        }

        @media (max-width: 600px) {
            .game-wrapper {
                padding: 18px 14px;
                border-radius: 40px;
            }

            .game-header h1 {
                font-size: 1.8rem;
                letter-spacing: 4px;
            }

            .question-text {
                font-size: 1.4rem;
                min-height: 5rem;
            }

            .options-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .option-btn {
                padding: 15px 6px;
                font-size: 1.15rem;
            }

            .btn {
                padding: 14px 18px;
                font-size: 1.1rem;
                min-width: 140px;
                letter-spacing: 2px;
            }

            .highlight-blank {
                min-width: 80px;
            }

            .stats-row {
                flex-direction: column;
                gap: 8px;
            }

            .score-box, .progress-box {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <!-- 花瓣飘落由JS动态生成 -->

    <div class="game-wrapper">
        <div class="game-header">
            <h1>· 诗 词 雅 集 ·</h1>
            <div class="subhead">初中古诗 · 补全挑战</div>
        </div>

        <div class="stats-row">
            <div class="score-box">
                <span>🏆 得分</span>
                <span class="score-value" id="scoreDisplay">0</span>
            </div>
            <div class="progress-box">
                <span>📖 进度</span>
                <span class="progress-value" id="progressDisplay">1 / 10</span>
            </div>
        </div>

        <div class="quiz-card">
            <div class="question-text" id="questionText">
                <!-- 动态填充 -->
            </div>
            <div class="options-grid" id="optionsContainer">
                <!-- 选项动态生成 -->
            </div>
            <div class="feedback" id="feedbackMessage"></div>
        </div>

        <div class="action-row">
            <button class="btn btn-next" id="nextBtn" disabled>下一题</button>
            <button class="btn btn-restart" id="restartBtn">重开</button>
        </div>

        <div class="footer-note">—— 腹有诗书气自华，读书万卷始通神 ——</div>
    </div>

    <script>
        (function(){
            // ---------- 题库 ----------
            const questions = [
                {
                    question: "床前明月光，疑是地上霜。举头望明月，______。",
                    options: ["低头思故乡", "对影成三人", "天涯共此时", "孤影自彷徨"],
                    correct: 0
                },
                {
                    question: "春眠不觉晓，处处闻啼鸟。夜来风雨声，______。",
                    options: ["花落知多少", "草色遥看近却无", "润物细无声", "一枝红杏出墙来"],
                    correct: 0
                },
                {
                    question: "______，春风不度玉门关。",
                    options: ["羌笛何须怨杨柳", "醉卧沙场君莫笑", "劝君更尽一杯酒", "天下谁人不识君"],
                    correct: 0
                },
                {
                    question: "会当凌绝顶，______。",
                    options: ["一览众山小", "无边落木萧萧下", "星河欲转千帆舞", "恨别鸟惊心"],
                    correct: 0
                },
                {
                    question: "沉舟侧畔千帆过，______。",
                    options: ["病树前头万木春", "柳暗花明又一村", "千树万树梨花开", "长河落日圆"],
                    correct: 0
                },
                {
                    question: "大漠孤烟直，______。",
                    options: ["长河落日圆", "烟波江上使人愁", "孤帆远影碧空尽", "夜泊秦淮近酒家"],
                    correct: 0
                },
                {
                    question: "日出江花红胜火，______。",
                    options: ["春来江水绿如蓝", "夜半钟声到客船", "浅草才能没马蹄", "谁家新燕啄春泥"],
                    correct: 0
                },
                {
                    question: "莫愁前路无知己，______。",
                    options: ["天下谁人不识君", "西出阳关无故人", "不及汪伦送我情", "江枫渔火对愁眠"],
                    correct: 0
                },
                {
                    question: "采菊东篱下，______。",
                    options: ["悠然见南山", "把酒问青天", "邀我至田家", "对影成三人"],
                    correct: 0
                },
                {
                    question: "______，霜叶红于二月花。",
                    options: ["停车坐爱枫林晚", "遥知兄弟登高处", "两岸猿声啼不住", "姑苏城外寒山寺"],
                    correct: 0
                }
            ];

            // 状态变量
            let currentIndex = 0;
            let score = 0;
            let answered = false;
            let totalQuestions = questions.length;
            let correctCount = 0; // 用于趣味统计

            // DOM 元素
            const questionTextEl = document.getElementById('questionText');
            const optionsContainer = document.getElementById('optionsContainer');
            const feedbackMessage = document.getElementById('feedbackMessage');
            const nextBtn = document.getElementById('nextBtn');
            const restartBtn = document.getElementById('restartBtn');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const progressDisplay = document.getElementById('progressDisplay');

            // ---------- 花瓣特效 ----------
            function createPetal() {
                const petal = document.createElement('div');
                petal.className = 'petal';
                const size = Math.random() * 15 + 10;
                petal.style.width = size + 'px';
                petal.style.height = size + 'px';
                petal.style.left = Math.random() * 100 + '%';
                petal.style.animationDuration = (Math.random() * 6 + 6) + 's';
                petal.style.animationDelay = Math.random() * 5 + 's';
                petal.style.background = `rgba(255, ${180 + Math.floor(Math.random()*60)}, ${190 + Math.floor(Math.random()*40)}, ${Math.random()*0.5+0.4})`;
                petal.style.opacity = Math.random() * 0.6 + 0.3;
                document.body.appendChild(petal);
                // 移除不再需要的花瓣
                setTimeout(() => {
                    if (petal.parentNode) petal.remove();
                }, 15000);
            }

            // 初始化若干花瓣并定时生成
            for (let i = 0; i < 15; i++) {
                setTimeout(() => createPetal(), i * 300);
            }
            setInterval(createPetal, 1200);

            // ---------- 浮动得分动画 ----------
            function showFloatingScore(amount, event) {
                const el = document.createElement('div');
                el.className = 'floating-score';
                el.textContent = `+${amount}`;
                // 获取点击按钮的位置或默认中间
                let x = window.innerWidth / 2;
                let y = window.innerHeight / 2;
                if (event && event.clientX) {
                    x = event.clientX;
                    y = event.clientY;
                }
                el.style.left = (x - 30) + 'px';
                el.style.top = (y - 40) + 'px';
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 1000);
            }

            // ---------- 格式化题目：下划线高亮 ----------
            function formatQuestionText(rawQuestion) {
                let safeStr = rawQuestion
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
                // 将连续的下划线替换为高亮span
                safeStr = safeStr.replace(/_{3,}/g, '<span class="highlight-blank">______</span>');
                // 处理换行
                safeStr = safeStr.replace(/\n/g, '<br>');
                return safeStr;
            }

            // ---------- 更新进度显示 ----------
            function updateProgress() {
                progressDisplay.textContent = `${currentIndex + 1} / ${totalQuestions}`;
            }

            // ---------- 加载题目 ----------
            function loadQuestion() {
                answered = false;
                feedbackMessage.textContent = '';
                feedbackMessage.className = 'feedback';
                nextBtn.disabled = true;

                const q = questions[currentIndex];
                questionTextEl.innerHTML = formatQuestionText(q.question);

                // 正确答案文本
                const correctAnswerText = q.options[q.correct];
                // 打乱选项
                let optionsArray = [...q.options];
                for (let i = optionsArray.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [optionsArray[i], optionsArray[j]] = [optionsArray[j], optionsArray[i]];
                }

                optionsContainer.innerHTML = '';
                optionsArray.forEach(optText => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = optText;
                    const isCorrect = (optText === correctAnswerText);
                    btn.dataset.correct = isCorrect ? 'true' : 'false';
                    btn.addEventListener('click', (e) => handleOptionClick(btn, isCorrect, e));
                    optionsContainer.appendChild(btn);
                });

                updateProgress();
            }

            // ---------- 处理点击选项 ----------
            function handleOptionClick(btn, isCorrect, event) {
                if (answered) return;
                if (btn.disabled) return;

                answered = true;
                const allBtns = Array.from(document.querySelectorAll('.option-btn'));

                // 禁用所有按钮并标记正确/错误
                allBtns.forEach(button => {
                    button.disabled = true;
                    if (button.dataset.correct === 'true') {
                        button.classList.add('correct');
                    } else if (button === btn && !isCorrect) {
                        button.classList.add('wrong');
                    }
                });

                if (isCorrect) {
                    // 确保正确按钮样式
                    btn.classList.add('correct');
                    btn.classList.remove('wrong');
                    // 加分
                    score += 10;
                    scoreDisplay.textContent = score;
                    correctCount++;
                    // 浮动得分
                    showFloatingScore(10, event);
                    // 趣味反馈语
                    const praises = ['✅ 妙啊！ +10 分', '🌟 诗仙附体！', '📜 千古名句，答对了！', '🎉 才华横溢！', '✨ 腹有诗书！'];
                    const praise = praises[Math.floor(Math.random() * praises.length)];
                    feedbackMessage.textContent = praise;
                    feedbackMessage.className = 'feedback success';
                } else {
                    feedbackMessage.textContent = '❌ 再想想… 正确答案已标出';
                    feedbackMessage.className = 'feedback error';
                }

                nextBtn.disabled = false;
            }

            // ---------- 下一题 ----------
            function nextQuestion() {
                // 移动到下一题，循环
                currentIndex = (currentIndex + 1) % totalQuestions;
                // 如果完成一圈，可以重置进度提示，但不影响
                loadQuestion();
            }

            // ---------- 重置游戏 ----------
            function resetGame() {
                currentIndex = 0;
                score = 0;
                correctCount = 0;
                scoreDisplay.textContent = '0';
                loadQuestion();
                // 清空反馈
                feedbackMessage.textContent = '';
                feedbackMessage.className = 'feedback';
                nextBtn.disabled = true;
            }

            // ---------- 初始化 ----------
            function initGame() {
                resetGame(); // 包含加载第一题
                nextBtn.addEventListener('click', nextQuestion);
                restartBtn.addEventListener('click', resetGame);
            }

            initGame();
        })();
    </script>
</body>
</html>
